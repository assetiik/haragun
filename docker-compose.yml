services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: haragun-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - haragun
    depends_on:
      - mysql

  nginx:
    image: nginx:1.27-alpine
    container_name: haragun-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - haragun
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    container_name: haragun-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: haragun
      MYSQL_USER: haragun
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - haragun-mysql:/var/lib/mysql
    networks:
      - haragun

networks:
  haragun:
    name: haragun_net
    driver: bridge

volumes:
  haragun-mysql:
    name: haragun_mysql
